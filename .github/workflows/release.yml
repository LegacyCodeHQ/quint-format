name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Use an OIDC-compatible npm version
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Select npm distribution tag
        id: npm-tag
        run: |
          VERSION=$(node --print "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        run: npm publish --tag "${{ steps.npm-tag.outputs.value }}"
